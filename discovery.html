<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultancy Business Guide</title>
    <!-- Include EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Initialize EmailJS with your Public Key (replace 'YOUR_PUBLIC_KEY' with your actual EmailJS public key)
            emailjs.init("OYDEFePcYvDjBdczh");
        })();
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            color: #0056b3;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consultancy Business Guide Inquiry</h2>
    <form id="consultancyForm">
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="emailAddress">Email Address:</label>
            <input type="email" id="emailAddress" name="emailAddress" required placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label for="businessType">Business/Consultancy Focus:</label>
            <input type="text" id="businessType" name="businessType" required placeholder="e.g., IT, Management, Financial">
        </div>

        <div class="form-group">
            <label for="message">Project Details / Message:</label>
            <textarea id="message" name="message" rows="5" required placeholder="Provide details about your query..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit and Send Results</button>
    </form>
</div>

<script>
    document.getElementById('consultancyForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.textContent = 'Sending...';
        submitBtn.disabled = true;

        // Fetching field values
        const fullName = document.getElementById('fullName').value;
        const emailAddress = document.getElementById('emailAddress').value;
        const businessType = document.getElementById('businessType').value;
        const message = document.getElementById('message').value;

        // Structured HTML formatted template parameters for a professional look in the email
        const templateParams = {
            to_email: 'mickusb@gmail.com',
            from_name: fullName,
            from_email: emailAddress,
            business_type: businessType,
            message_content: message,
            // Pre-formatted professional HTML block for your email notification template
            html_message: `
                <div style="font-family: Arial, sans-serif; padding: 20px; border: 1px solid #e0e0e0; border-radius: 5px; background-color: #f9f9f9;">
                    <h2 style="color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px;">New Consultancy Guide Submission</h2>
                    <p style="font-size: 14px; color: #555;">You have received a new submission from your Consultancy Business Guide web form.</p>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold; width: 30%;">Full Name:</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd;">${fullName}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">Email Address:</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd;"><a href="mailto:${emailAddress}">${emailAddress}</a></td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd; font-weight: bold;">Business Focus:</td>
                            <td style="padding: 10px; border-bottom: 1px solid #ddd;">${businessType}</td>
                        </tr>
                        <tr>
                            <td style="padding: 10px; border-top: 1px solid #ddd; font-weight: bold; vertical-align: top;">Message / Details:</td>
                            <td style="padding: 10px; border-top: 1px solid #ddd; white-space: pre-wrap;">${message}</td>
                        </tr>
                    </table>
                    <p style="font-size: 12px; color: #888; margin-top: 20px; text-align: center;">This is an automated notification sent from your web application.</p>
                </div>
            `
        };

        // Replace 'YOUR_SERVICE_ID' and 'YOUR_TEMPLATE_ID' with your actual EmailJS identifiers
        emailjs.send(service_8pez0v9, template_heb4vbg, templateParams)
            .then(function(response) {
                alert('Success! Your details have been submitted and emailed successfully.');
                document.getElementById('consultancyForm').reset();
                submitBtn.textContent = 'Submit and Send Results';
                submitBtn.disabled = false;
            }, function(error) {
                alert('FAILED...', error);
                submitBtn.textContent = 'Submit and Send Results';
                submitBtn.disabled = false;
            });
    });
</script>

</body>
</html>
